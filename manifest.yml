modules:
  jira:projectPage:
    - key: medtrace-matrix-page
      title: MedTrace IEC 62304
      resource: main
      resolver:
        function: resolver-fn
  jira:issuePanel:
    - key: medtrace-issue-panel
      title: MedTrace Regulatory & Safety
      icon: resource:icons;medtrace-icon.svg
      resource: main
      resolver:
        function: resolver-fn
  jira:workflowValidator:
    - key: medtrace-safety-validator
      name: MedTrace IEC 62304 Safety Gate
      description: Validates full bidirectional verification and 21 CFR Part 11 signatures before transitioning Jira issues to Done.
      function: workflow-validator-fn
  confluence:contentBylineItem:
    - key: medtrace-confluence-byline
      title: MedTrace Part 11 Status
      icon: resource:icons;medtrace-icon.svg
      resource: main
      resolver:
        function: resolver-fn
  confluence:globalPage:
    - key: medtrace-confluence-page
      title: MedTrace IEC 62304
      route: medtrace-compliance
      resource: main
      resolver:
        function: resolver-fn
  trigger:
    - key: medtrace-confluence-page-updated
      events:
        - avi:confluence:updated:page
      function: confluence-trigger-fn
  rovo:agent:
    - key: medtrace-regulatory-auditor
      name: MedTrace Auditor
      description: Assistive traceability checker for IEC 62304, ISO 14971, and 21 CFR Part 11 records (not a regulatory authority).
      prompt: |
        You are the MedTrace Traceability Assistant. You help engineers inspect configured traceability links and modeled or tenant records associated with IEC 62304 (Medical Device Software Life Cycle Processes), ISO 14971 (Application of Risk Management to Medical Devices), and 21 CFR Part 11 attestation records. You do not determine regulatory compliance or replace independent quality and regulatory assessment.
        When the user asks you to review an issue, component, or sprint:
        1. Check the configured IEC 62304 software safety class (Class A, B, or C).
        2. Inspect bidirectional traceability across Hazard -> Safety Requirement (Confluence) -> Jira Task -> Verification Test.
        3. Flag any Class C hazard lacking recorded test verification or having an invalidated electronic signature record.
        4. Provide actionable guidance to address traceability gaps prior to independent release review.
      actions:
        - get-hazard-lineage-action
        - verify-iec-compliance-action
      conversationStarters:
        - Audit current sprint for IEC 62304 compliance gaps
        - Inspect IEC 62304 Class C hazards for Smart Infusion Pump
        - Verify 21 CFR Part 11 electronic signature validity
  action:
    - key: get-hazard-lineage-action
      name: Get Hazard Lineage
      description: Retrieves complete ISO 14971 hazard safety lineage, linked Confluence SRS specifications, and verification test status.
      actionVerb: GET
      function: rovo-action-fn
      inputs:
        issueKey:
          title: Issue or Hazard Key
          type: string
          required: false
          description: Optional Jira issue key, hazard key, or test key to inspect (e.g. MED-42, HAZ-101, TEST-88). Omit to retrieve the full project lineage.
    - key: verify-iec-compliance-action
      name: Verify IEC Compliance
      description: Checks compliance status against IEC 62304 and FDA 21 CFR Part 11 rules, returning broken links or signature drift.
      actionVerb: GET
      function: rovo-action-fn
      inputs:
        issueKey:
          title: Issue Key
          type: string
          required: false
          description: Optional Jira issue key referenced by the change under audit (e.g. MED-42).
        prDiff:
          title: PR Diff
          type: string
          required: false
          description: Optional code diff or change snippet to audit against safety-critical hazards.
        componentName:
          title: Component Name
          type: string
          required: false
          description: Optional component or subsystem name.
  rovo:mcp:
    - key: medtrace-mcp-server
      name: MedTrace MCP Server
      tools:
        - get-hazard-lineage-action
        - verify-iec-compliance-action
  webtrigger:
    - key: mcp-sync-webtrigger
      function: mcp-webtrigger-fn
  function:
    - key: resolver-fn
      handler: index.resolverHandler
    - key: workflow-validator-fn
      handler: index.workflowValidatorHandler
    - key: rovo-action-fn
      handler: index.rovoActionHandler
    - key: mcp-webtrigger-fn
      handler: index.mcpWebtriggerHandler
    - key: confluence-trigger-fn
      handler: index.confluencePageUpdatedTrigger
resources:
  - key: main
    path: static/frontend/dist
  - key: icons
    path: static/icons
permissions:
  scopes:
    # Jira read scopes (TeamworkGraphService queries Jira REST issue metadata and remotelinks under read:jira-work)
    - read:jira-work
    - read:jira-user
    # Teamwork Graph curated query confluencePageOwners for spec owners
    - read:graph:page:confluence
    - read:graph:user:atlassian
    # Granular Confluence REST v2 + current-user + avi:confluence:updated:page trigger scopes (required for /wiki/api/v2/pages, /spaces, /*/operations, and /wiki/rest/api/user/current)
    - read:page:confluence
    - read:space:confluence
    - read:user:confluence
    - read:content.metadata:confluence
    - storage:app
  content:
    styles:
      # Required by @xyflow/react runtime transform inline styles on graph nodes/edges; scripts remain locked down without unsafe-inline or external egress
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/5e49c10e-696f-4984-9d00-4a47d0a5dd99
