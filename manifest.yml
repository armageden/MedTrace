modules:
  jira:projectPage:
    - key: medtrace-matrix-page
      title: MedTrace IEC 62304
      resource: main
      resolver:
        function: resolver-fn
  jira:issuePanel:
    - key: medtrace-issue-panel
      title: MedTrace Regulatory & Safety
      icon: resource:icons;medtrace-icon.svg
      resource: main
      resolver:
        function: resolver-fn
  jira:workflowValidator:
    - key: medtrace-safety-validator
      name: MedTrace IEC 62304 Safety Gate
      description: Validates full bidirectional verification and cryptographic approval attestations before transitioning Jira issues to Done.
      function: workflow-validator-fn
  confluence:contentBylineItem:
    - key: medtrace-confluence-byline
      title: MedTrace Attestation Status
      icon: resource:icons;medtrace-icon.svg
      resource: main
      resolver:
        function: resolver-fn
  confluence:globalPage:
    - key: medtrace-confluence-page
      title: MedTrace IEC 62304
      route: medtrace-compliance
      resource: main
      resolver:
        function: resolver-fn
  trigger:
    - key: medtrace-confluence-page-updated
      events:
        - avi:confluence:updated:page
      function: confluence-trigger-fn
    - key: medtrace-jira-issue-updated
      events:
        - avi:jira:updated:issue
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
      function: jira-trigger-fn
  rovo:agent:
    - key: medtrace-regulatory-auditor
      name: MedTrace Auditor
      description: Engineering traceability assistant for Jira issues, Confluence specs, verification tests, and approval hashes.
      prompt: |
        You are an engineering traceability assistant for MedTrace in Jira and Confluence.
        Help software teams inspect linked requirements, verification test status, and approval signature records using the configured actions.
        When asked to review an issue, hazard, or sprint:
        1. Retrieve the trace chain across hazard, Confluence specification, Jira work item, verification test, and approval record.
        2. Summarize missing links, pending test evidence, or specification hash mismatches found in the workspace.
        3. Share clear next steps so engineers can resolve open traceability gaps before release review.
        Re-verification Jira tasks are never automatically created by MedTrace — when recommending re-verification, instruct the user to create a linked re-verification task from the MedTrace UI (or explicitly invoke create-reverification-task-action).
        Always base findings strictly on tool output and remind users that independent quality review is still required.
      actions:
        - get-hazard-lineage-action
        - verify-iec-compliance-action
        - create-reverification-task-action
      conversationStarters:
        - Audit current sprint for traceability gaps
        - Inspect Class C hazard lineage and test status
        - Verify specification approval hash status
        - Create re-verification task for drifted hazard
  action:
    - key: get-hazard-lineage-action
      name: Get Hazard Lineage
      description: Retrieves complete ISO 14971 hazard safety lineage, linked Confluence SRS specifications, and verification test status.
      actionVerb: GET
      function: rovo-action-fn
      inputs:
        issueKey:
          title: Issue or Hazard Key
          type: string
          required: false
          description: Optional Jira issue key, hazard key, or test key to inspect (e.g. MED-42, HAZ-101, TEST-88). Omit to retrieve the full project lineage.
    - key: verify-iec-compliance-action
      name: Verify IEC Compliance
      description: Checks compliance status against configured IEC 62304 traceability rules and approval hashes, returning broken links or signature drift.
      actionVerb: GET
      function: rovo-action-fn
      inputs:
        issueKey:
          title: Issue Key
          type: string
          required: false
          description: Optional Jira issue key referenced by the change under audit (e.g. MED-42).
        prDiff:
          title: PR Diff
          type: string
          required: false
          description: Optional code diff or change snippet to audit against safety-critical hazards.
        componentName:
          title: Component Name
          type: string
          required: false
          description: Optional component or subsystem name.
    - key: create-reverification-task-action
      name: Create Re-Verification Task
      description: Creates a linked Jira re-verification task for a hazard or work item affected by approval drift or traceability gaps under the caller's Jira permissions.
      actionVerb: CREATE
      function: rovo-action-fn
      inputs:
        hazardKey:
          title: Hazard Key
          type: string
          required: false
          description: Hazard key affected by signature drift or verification gap (e.g. MEDTRACE-10 or HAZ-101).
        issueKey:
          title: Issue Key
          type: string
          required: false
          description: Jira work or test issue key to link with the re-verification task (e.g. MEDTRACE-1).
        summary:
          title: Task Summary
          type: string
          required: false
          description: Optional custom summary for the created Jira re-verification task.
        reason:
          title: Drift or Gap Reason
          type: string
          required: false
          description: Optional explanation of the requirement change or compliance gap triggering re-verification.
  rovo:mcp:
    - key: medtrace-mcp-server
      name: MedTrace MCP Server
      tools:
        - get-hazard-lineage-action
        - verify-iec-compliance-action
        - create-reverification-task-action
  webtrigger:
    - key: mcp-sync-webtrigger
      function: mcp-webtrigger-fn
  function:
    - key: resolver-fn
      handler: index.resolverHandler
    - key: workflow-validator-fn
      handler: index.workflowValidatorHandler
    - key: rovo-action-fn
      handler: index.rovoActionHandler
    - key: mcp-webtrigger-fn
      handler: index.mcpWebtriggerHandler
    - key: confluence-trigger-fn
      handler: index.confluencePageUpdatedTrigger
    - key: jira-trigger-fn
      handler: index.jiraIssueUpdatedTrigger
resources:
  - key: main
    path: static/frontend/dist
  - key: icons
    path: static/icons
permissions:
  scopes:
    # Jira read + write scopes (TeamworkGraphService / LiveIngestionService + user-scoped re-verification task creation)
    - read:jira-work
    - write:jira-work
    - read:jira-user
    # Teamwork Graph curated query confluencePageOwners for spec owners
    - read:graph:page:confluence
    - read:graph:user:atlassian
    # Granular Confluence REST v2 + current-user + avi:confluence:updated:page trigger scopes (required for /wiki/api/v2/pages, /spaces, /*/operations, and /wiki/rest/api/user/current)
    - read:page:confluence
    - read:space:confluence
    - read:user:confluence
    - read:content.metadata:confluence
    - storage:app
  content:
    styles:
      # Required by @xyflow/react runtime transform inline styles on graph nodes/edges; scripts remain locked down without unsafe-inline or external egress
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/5e49c10e-696f-4984-9d00-4a47d0a5dd99
