modules:
  jira:projectPage:
    - key: medtrace-matrix-page
      title: MedTrace IEC 62304
      resource: main
      resolver:
        function: resolver-fn
  jira:issuePanel:
    - key: medtrace-issue-panel
      title: MedTrace Regulatory & Safety
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver-fn
  jira:workflowValidator:
    - key: medtrace-safety-validator
      name: MedTrace IEC 62304 Safety Gate
      description: Validates full bidirectional verification and 21 CFR Part 11 signatures before transitioning Jira issues to Done.
      function: workflow-validator-fn
  rovo:agent:
    - key: medtrace-regulatory-auditor
      name: MedTrace Auditor
      description: AI regulatory compliance officer auditing IEC 62304 traceability and ISO 14971 risk mitigations.
      prompt: |
        You are the MedTrace Regulatory Compliance Officer. You enforce IEC 62304 (Medical Device Software Life Cycle Processes), ISO 14971 (Application of Risk Management to Medical Devices), and FDA 21 CFR Part 11 (Electronic Signatures).
        When the user asks you to audit an issue, component, or sprint:
        1. Check the ISO 14971 Risk Classification (Class A, B, or C).
        2. Verify unbroken bidirectional traceability: Hazard -> Safety Requirement (Confluence) -> Jira Task -> Verification Test.
        3. Flag any Class C hazard lacking automated test verification or having an invalidated 21 CFR Part 11 cryptographic signature.
        4. Provide actionable guidance to remediate compliance gaps before clinical release.
      actions:
        - get-hazard-lineage-action
        - verify-iec-compliance-action
      conversationStarters:
        - Audit current sprint for IEC 62304 compliance gaps
        - Inspect ISO 14971 Class C hazards for Smart Infusion Pump
        - Verify 21 CFR Part 11 electronic signature validity
  action:
    - key: get-hazard-lineage-action
      name: Get Hazard Lineage
      description: Retrieves complete ISO 14971 hazard safety lineage, linked Confluence SRS specifications, and verification test status.
      actionVerb: GET
      function: rovo-action-fn
    - key: verify-iec-compliance-action
      name: Verify IEC Compliance
      description: Checks compliance status against IEC 62304 and FDA 21 CFR Part 11 rules, returning broken links or signature drift.
      actionVerb: GET
      function: rovo-action-fn
  rovo:mcp:
    - key: medtrace-mcp-server
      name: MedTrace MCP Server
      tools:
        - get-hazard-lineage-action
        - verify-iec-compliance-action
  webtrigger:
    - key: mcp-sync-webtrigger
      function: mcp-webtrigger-fn
  function:
    - key: resolver-fn
      handler: index.resolverHandler
    - key: workflow-validator-fn
      handler: index.workflowValidatorHandler
    - key: rovo-action-fn
      handler: index.rovoActionHandler
    - key: mcp-webtrigger-fn
      handler: index.mcpWebtriggerHandler
resources:
  - key: main
    path: static/frontend/dist
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - storage:app
  content:
    styles:
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/5e49c10e-696f-4984-9d00-4a47d0a5dd99
